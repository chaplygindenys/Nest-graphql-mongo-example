version: "3.9"
services:
api:
build: .
container_name: nest-graphql-api
restart: unless-stopped
env_file: .env.docker
ports:
- "3000:3000"
depends_on:
- mongo


mongo:
image: mongo:7
container_name: mongo
restart: unless-stopped
environment:
MONGO_INITDB_DATABASE: nest_tasks
volumes:
- mongo_data:/data/db
ports:
- "27017:27017"


volumes:
mongo_data:
